name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Copy the app into the Android project
        run: npm run sync

      # Optional: if the signing key is stored as repository secrets, CI signs the release APK itself.
      - name: Signing key from secrets
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build release and debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/Himayath-Sagar.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Himayath-Sagar-unsigned.apk
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/Himayath-Sagar.apk ]; then
            gh release view apk >/dev/null 2>&1 || gh release create apk --title "Android APK (latest build)" --notes "Install Himayath-Sagar.apk. Signed with the app's permanent key, so each update installs over the previous one."
            gh release upload apk out/Himayath-Sagar.apk --clobber
          else
            # unsigned build, signed afterwards with the permanent key (see tools/sign-apk.md)
            gh release view ci-build >/dev/null 2>&1 || gh release create ci-build --prerelease --title "CI build (unsigned, not for installing)" --notes "Unsigned release build from main, waiting to be signed."
            gh release upload ci-build out/Himayath-Sagar-unsigned.apk --clobber
          fi

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apk

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test tools
        run: npm install --no-save --no-package-lock playwright-core@1.63.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: node tools/ci/emulator-test.mjs apk/app-debug.apk; pip3 install --quiet --break-system-packages cryptography || true; node tools/ci/builtin-data-test.mjs

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l shots || exit 0
          cd shots && zip -q ../emulator-shots.zip *.png report.json && cd ..
          gh release view ci-screens >/dev/null 2>&1 || gh release create ci-screens --prerelease --title "CI emulator screenshots" --notes "Screenshots from the emulator test (made-up test data)."
          gh release upload ci-screens emulator-shots.zip --clobber
