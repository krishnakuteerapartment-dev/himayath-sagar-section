<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Himayath Sagar DTR Verify</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1556b8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webfonts" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: one-column field tool (max 640px). Sticky header, DTR picker card, scan actions, result card, status-tabbed service list, fixed bottom tabs */
:root{
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px)); --sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --bg:#f2f5fb; --surface:#ffffff; --surface-2:#f5f8fd; --ink:#132039; --muted:#5a6880; --line:#d8e1ee;
  --accent:#1556b8; --accent-ink:#ffffff; --accent-soft:#e2ecfb;
  --lcd:#bfdcff; --lcd-ink:#0b2c5c; --lcd-dim:#4f74a8; --lcd-edge:#8db8ef;
  --ok:#21794a; --ok-soft:#ddf1e5; --warn:#a2610a; --warn-soft:#faedd6; --bad:#b8352a; --bad-soft:#f9e1de;
  --p1:#0e6f8a; --p1-soft:#dcf1f7; --p3:#7f46a6; --p3-soft:#f0e5f8;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-lcd:"Share Tech Mono","IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#121b2e; --surface-2:#18233a; --ink:#e4ebf7; --muted:#95a3ba; --line:#253350;
  --accent:#5b9dff; --accent-ink:#06142e; --accent-soft:#16294a;
  --lcd:#7fb2f5; --lcd-ink:#071a38; --lcd-dim:#2f5488; --lcd-edge:#5f95dc;
  --ok:#5cc282; --ok-soft:#12301f; --warn:#e6a94f; --warn-soft:#33270f; --bad:#f07a68; --bad-soft:#3a1a16;
  --p1:#5cc6e3; --p1-soft:#0f2e3a; --p3:#c99be8; --p3-soft:#2f2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2e; --surface-2:#18233a; --ink:#e4ebf7; --muted:#95a3ba; --line:#253350;
  --accent:#5b9dff; --accent-ink:#06142e; --accent-soft:#16294a;
  --lcd:#7fb2f5; --lcd-ink:#071a38; --lcd-dim:#2f5488; --lcd-edge:#5f95dc;
  --ok:#5cc282; --ok-soft:#12301f; --warn:#e6a94f; --warn-soft:#33270f; --bad:#f07a68; --bad-soft:#3a1a16;
  --p1:#5cc6e3; --p1-soft:#0f2e3a; --p3:#c99be8; --p3-soft:#2f2140; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:var(--sat)}
html{scroll-padding-top:calc(var(--sat) + 72px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-code);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{position:sticky;top:var(--sat);z-index:20;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 10px rgba(14,40,90,.18)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px;
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}
.top h1{font-family:var(--f-head);font-weight:700;font-size:19px;letter-spacing:.01em;margin:0;line-height:1.1;min-width:0;flex:1}
.top h1 small{display:block;font-family:var(--f-ui);font-weight:500;font-size:12px;opacity:.85;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}

main{max-width:640px;margin:0 auto;padding-block:14px calc(86px + var(--sab));
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));
  display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-head);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font-family:var(--f-head);font-weight:700;font-size:22px;margin:0;text-wrap:balance;line-height:1.15}
h3{font-family:var(--f-head);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.picker{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.picker select{width:100%;min-height:50px;border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:0 10px;font-family:var(--f-code);font-size:15px;font-weight:600}
.sq{width:46px;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:grid;place-items:center;cursor:pointer}
.sq svg{width:20px;height:20px}
.sq:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-height:44px;flex:1;min-width:0}
.field input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:42px;font-size:16px}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-nf{background:var(--bad)}.bar .b-el{background:var(--warn)}

.stabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stab{background:var(--surface);border:0;padding:8px 4px 7px;cursor:pointer;text-align:center;min-width:0}
.stab b{display:block;font-family:var(--f-head);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stab span{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em;line-height:1.2}
.stab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stab[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.stab.t-ok b{color:var(--ok)}.stab.t-other b{color:var(--warn)}.stab.t-unk b{color:var(--bad)}.stab.t-nf b{color:var(--bad)}
.stab[aria-pressed="true"] b{color:var(--accent-ink)}
.stabs.four{grid-template-columns:repeat(4,minmax(0,1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.15}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:62px;font-size:16px;font-family:var(--f-head);letter-spacing:.02em}
.btn.big svg{width:26px;height:26px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.res{border-radius:var(--r);padding:14px;border:2px solid;display:flex;flex-direction:column;gap:8px}
.res.ok{border-color:var(--ok);background:var(--ok-soft)}
.res.other{border-color:var(--warn);background:var(--warn-soft)}
.res.unk{border-color:var(--bad);background:var(--bad-soft)}
.res .verdict{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.02em}
.res.ok .verdict{color:var(--ok)}.res.other .verdict{color:var(--warn)}.res.unk .verdict{color:var(--bad)}
.res .verdict svg{width:24px;height:24px;flex:none}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idbox{background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.idbox span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.idbox b{display:block;font-family:var(--f-code);font-size:20px;font-weight:600;overflow-wrap:anywhere;line-height:1.2}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.list>.li:not(.open){content-visibility:auto;contain-intrinsic-size:auto 62px}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;font-size:13px}
.li.open{background:var(--surface-2)}
.detail{padding:4px 14px 14px;background:var(--surface-2);border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;vertical-align:1px;white-space:nowrap}
.pill.p1{background:var(--p1-soft);color:var(--p1)}.pill.p3{background:var(--p3-soft);color:var(--p3)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.kv dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.more{display:block;text-align:center;color:var(--muted);font-size:13px}

.viewfinder{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .aim{position:absolute;inset:24% 10%;border:2px solid rgba(255,255,255,.9);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.viewfinder .laser{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff5a3c;box-shadow:0 0 8px #ff5a3c}
@media (prefers-reduced-motion:no-preference){.viewfinder .laser{animation:sweep 1.6s ease-in-out infinite alternate}}
@keyframes sweep{from{top:28%}to{top:72%}}
.hint{font-size:13px;color:var(--muted);margin:0}
.irmodes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.irm{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 6px;font-family:var(--f-head);font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;text-align:center}
.irm[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.irm.wide{grid-column:1/-1}
.log{background:#0b1210;color:#b9e3c9;font-family:var(--f-code);font-size:12.5px;line-height:1.55;border-radius:8px;padding:10px 12px;min-height:96px;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .tx{color:#ffd07a}.log .rx{color:#8fd3ff}.log .ok{color:#7be39b}.log .er{color:#ff8a7a}.log .dim{color:#7c978b}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--surface-2);font-size:12px;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.wrap td{white-space:normal}
.plan p,.plan li{max-width:65ch}
.plan ol,.plan ul{padding-left:20px;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum div{background:var(--surface);padding:10px;min-width:0}
.sum b{display:block;font-family:var(--f-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sum span{font-size:11.5px;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  padding-left:max(4px,var(--sal));padding-right:max(4px,var(--sar))}
.tab{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 9px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.dtrinfo{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.dname{font-family:var(--f-head);font-size:18px;font-weight:700;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.mchips{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.mchip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.mchip b{font-family:var(--f-code)}.mchip span{color:var(--muted)}
.claims{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:8px;padding:8px 10px}
.claim{font-size:13px;min-width:0}
.claim b{font-weight:700}
.claim>span{display:block;color:var(--muted);font-size:12px}
select.sel{display:block;width:100%;max-width:100%;min-height:46px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 10px;color:var(--ink)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;letter-spacing:.03em}
.claimrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.claimrow .claim{flex:1}
.cfl{border-color:var(--bad)}
.cbanner{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-size:14px}
.cbanner svg{width:22px;height:22px;flex:none;color:var(--bad)}
.rtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.rtabs::-webkit-scrollbar{display:none}
.rtab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.rtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rtab.hot{border-color:var(--bad);color:var(--bad)}.rtab.hot[aria-selected="true"]{background:var(--bad);color:#fff}
.chips2{display:flex;gap:4px}.chip2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip2[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dlgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
table.rep th.grp{text-align:center;border-left:1px solid var(--line);color:var(--ink)}
table.rep tfoot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--line)}
.tsub{font-size:11px;color:var(--muted);font-weight:400}
tr[aria-expanded="true"] td{background:var(--accent-soft)}
tr.sub>td{background:var(--surface-2);padding:10px;white-space:normal}
table.inner{background:var(--surface);border:1px solid var(--line);border-radius:6px}
table.inner th,table.inner td{padding:5px 8px;font-size:12px}
.mtr{display:inline-block;width:64px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;vertical-align:middle}
.mtr i{display:block;height:100%;background:var(--ok)}
.mtr.wide{display:block;width:100%}
.rrow .s.wide{grid-column:1/-1;white-space:normal;overflow:visible}
.rrow .t{white-space:normal}
.rrow .r b{font-family:var(--f-head);font-size:16px}
.rtot{gap:6px}
.drows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.drow:first-child{border-top:0}
.drow .tsub{grid-column:1/-1}
.drow>div{min-width:0;overflow-wrap:anywhere}
.inp{display:block;width:100%;min-height:46px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 12px;color:var(--ink);font-size:16px}
.store{cursor:pointer}.store.bad{background:var(--bad);color:#fff}
.upill{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.login{max-width:420px;width:100%;margin:6vh auto 0}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:44px;height:44px;color:var(--accent);flex:none}
.brand b{display:block;font-family:var(--f-head);font-size:20px}
.brand span{font-size:13px;color:var(--muted)}
.sumry{cursor:pointer;font-weight:600;padding:6px 0}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}

/* hamburger menu: side drawer */
.hamb{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;color:inherit;display:grid;place-items:center;border-radius:12px;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hamb svg{width:25px;height:25px}
.hamb:active{background:rgba(255,255,255,.18)}
.drawer-bg{position:fixed;inset:0;background:rgba(8,18,40,.46);z-index:55;opacity:0;transition:opacity .22s ease}
.drawer-bg.on{opacity:1}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--surface);z-index:56;transform:translateX(-104%);transition:transform .27s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:8px 0 32px rgba(0,0,0,.24);border-radius:0 20px 20px 0;overflow:hidden}
.drawer.on{transform:none}
.dr-head{background:var(--accent);color:var(--accent-ink);padding:calc(var(--sat) + 18px) 18px 16px 20px;display:flex;flex-direction:column;gap:10px;flex:none}
.dr-brand{display:flex;align-items:center;gap:12px}
.dr-logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}

/* ---------- master data ---------- */

    const c=ln.split('\t'); // field order = F

const Store={mode:'device',db:null,seen:new Set(),

/* ---------- who is recording ----------
   Inside the page: the viewer's id from the user capability; the signed-in admin acts as supervisor.

const Who={id:null,sup:false,u:null,ready:false,name:'',

const byTag=id=>`<span data-uid="${h(id||'')}">…</span>`;
const ST_LABEL={ok:'Verified',other:'Found here',conf:'In admin review',nf:'Not found',na:'No access'};

/* ---------- scan matching ---------- */
/* A meter's QR or barcode does not always hold just the meter number: it may add the maker (HPL06695910), the year, or other fields.
   1) any whole token that is a meter no, UKSCNO or service no; 2) a meter number found inside the code (7+ characters);
   3) the code being the end of a longer meter number (HP240318826598 read as 240318826598). Ties prefer the selected DTR. */
let meterSuffix=null;
function suffixIndex(){if(meterSuffix)return meterSuffix;meterSuffix=new Map();
  for(const [nm,arr] of S.byM)if(nm.length>=8)for(let i=1;i<=nm.length-7;i++){const k=nm.slice(i);const a=meterSuffix.get(k);if(a)a.push(...arr);else meterSuffix.set(k,arr.slice())}
  return meterSuffix}
function pickHere(m){const live=m.filter(x=>!x.x);return live.find(x=>x.dtr===S.dtr)||live[0]||m[0]}
function resolveScan(text){
  const t=String(text||'').toUpperCase();
  const toks=[t.replace(/\s+/g,''),...(t.match(/[A-Z0-9]{4,24}/g)||[])];
  for(const k of toks){
    const m=S.byM.get(normM(k));if(m&&m.length){const all=m.filter(x=>!x.x);return{o:pickHere(m),by:'Meter no',key:k,all:all.length>1?all:null}}
    if(S.byU.has(k))return{o:S.byU.get(k),by:'UKSCNO',key:k};
    if(S.byS.has(k))return{o:S.byS.get(k),by:'Service no',key:k};
  }
  const flat=t.replace(/[^A-Z0-9]/g,'');let best=null;
  for(let i=0;i<flat.length;i++)for(let L=Math.min(15,flat.length-i);L>=7;L--){const n=normM(flat.slice(i,i+L));if(n.length<6)continue;
    const m=S.byM.get(n);if(m){if(!best||n.length>best.n.length||(n.length===best.n.length&&m.some(x=>x.dtr===S.dtr)))best={n,m};break}}
  if(best){const all=best.m.filter(x=>!x.x);return{o:pickHere(best.m),by:'Meter no (in code)',key:best.n,all:all.length>1?all:null}}
  for(const k of toks){const n=normM(k);if(n.length<7)continue;const m=suffixIndex().get(n);
    if(m){const uniq=[...new Set(m)],here=uniq.filter(x=>x.dtr===S.dtr&&!x.x);if(uniq.length===1||here.length===1)return{o:here[0]||uniq[0],by:'Meter no (end)',key:n}}}

}
async function processScan(text,src,fromCamera){
  if(!S.dtr){toast('Select a DTR structure code first');return}
  const r=resolveScan(text);const now=Date.now();const raw=String(text).slice(0,120);
  let res;
  if(!r.o&&fromCamera){S.pending={type:'unknown',raw,src,key:r.key};S.last=null;beep('warn');return showResult()}
  if(!r.o){
    const key=normM(r.key)||('X'+now);const prev=vrec(S.dtr).x[key];
    await Store.put(S.dtr,'x',key,{raw,src,t:now,by:Who.id});
    res={kind:'unk',raw,src,undo:{kind:'x',key,prev}};beep('bad');
  }else if(r.o.x){
    const o=r.o;const key=normM(o.m)||o.u;const prev=vrec(S.dtr).x[key];
    await Store.put(S.dtr,'x',key,{raw,src,t:now,svc:o.s,u:o.u,by:Who.id});
    res={kind:'legacy',o,raw,src,by:r.by,undo:{kind:'x',key,prev}};beep('bad');
  }else{
    const o=r.o;const prev=vrec(S.dtr).s[o.u];
    const multi=r.all&&r.all.length>1?r.all:null;
    const elsewhere=claimsFor(o.u,S.dtr);
    if(elsewhere.length){
      // the same service is already placed on another DTR: nothing is saved until someone decides
      S.pending={type:'conflict',o,src,raw,by:r.by,others:elsewhere,multi};S.last=null;beep('bad');return showResult();
    }
    if(o.dtr===S.dtr){
      const dup=live(prev)&&prev.st==='ok';
      if(!dup)await Store.put(S.dtr,'s',o.u,{st:'ok',src,raw,t:now,by:Who.id});
      res={kind:'ok',o,src,by:r.by,dup,dupT:dup?prev.t:0,undo:dup?null:{kind:'s',key:o.u,prev}};beep('ok');
    }else if(isClaim(prev)){

    }else{

const progText=(d,st)=>d.list.length?`${d.list.length} services · ${d.p1} single-phase · ${d.p3} three-phase · ${st.ok+st.nf+st.el} of ${st.n} done`:'';

  const d=S.dtrMap.get(S.dtr);if(!d||!$('svcList'))return renderVerify();

const refreshAfterScan=()=>refreshVerify(false);
/* decisions on a held scan */
async function decide(action){

  if(action==='cancel'){S.pending=null;S.last=null;toast(p.type==='unknown'?'Ignored':'Cancelled. Nothing saved.');return showResult()}
  if(action==='recordx'&&p.type==='unknown'){const key=normM(p.key)||('X'+now);const prev=vrec(S.dtr).x[key];
    await Store.put(S.dtr,'x',key,{raw:p.raw,src:p.src,t:now,by:Who.id});S.pending=null;S.last={kind:'unk',raw:p.raw,src:p.src,undo:{kind:'x',key,prev}};beep('bad');return showResult()}
  if((action==='review'||action==='move')&&!reason){toast('Choose a reason first');const s=$('pReason');if(s)s.focus();return}
  const prev=vrec(S.dtr).s[o.u];
  if(action==='confirm'){
    await Store.put(S.dtr,'s',o.u,{st:'other',src:p.src,raw:p.raw,t:now,mdtr:o.dtr,by:Who.id});
    S.last={kind:'other',o,src:p.src,by:p.by,multi:p.multi,undo:{kind:'s',key:o.u,prev}};beep('ok');
  }else if(action==='review'){
    await Store.put(S.dtr,'s',o.u,{st:'conf',src:p.src,raw:p.raw,t:now,mdtr:o.dtr,reason,by:Who.id});
    S.last={kind:'conf',o,src:p.src,by:p.by,others:p.others,reason,undo:{kind:'s',key:o.u,prev}};toast('Sent to admin review');
  }else if(action==='move'&&Who.sup){
    await Store.put(S.dtr,'s',o.u,{st:o.dtr===S.dtr?'ok':'other',src:p.src,raw:p.raw,t:now,mdtr:o.dtr,reason,by:Who.id,moved:1,from:(p.others[p.others.length-1]||{}).dtr});
    for(const c of p.others)await Store.put(c.dtr,'s',o.u,{del:1,t:now,movedTo:S.dtr,reason,by:Who.id});
    S.last={kind:o.dtr===S.dtr?'ok':'other',o,src:p.src,by:p.by,moved:p.others.map(c=>c.dtr)};toast('Moved to this DTR. Earlier entry removed.');
  }
  S.pending=null;showResult();
}

function openDtrSheet(opts){
  opts=opts||{};const cur=opts.cur===undefined?S.dtr:opts.cur;
  const RH=62;let items=S.dtrs,filt='all';
  const el=Sheet.open(`<div class="sh-head"><div class="row between sh-title"><h3>${h(opts.title||'Choose DTR')}</h3><span class="small muted">${fmt(S.dtrs.length)} DTRs</span></div>

    <div class="sh-body" id="dsB"><div class="vlist" id="dsL"></div></div>`);
  const q=el.querySelector('#dsQ'),body=el.querySelector('#dsB'),list=el.querySelector('#dsL');
  const row=(d,i)=>{const st=dtrStats(d),done=st.ok+st.nf+st.el;
    return `<button class="vrow ${d.code===cur?'cur':''} ${d.list.length?'':'none'}" data-pick="${d.code}" style="top:${i*RH}px"><span class="nm"><b class="cd">${d.code}</b> ${h(d.name||'NO NAME')}</span><span class="sub">${d.list.length?d.list.length+' services':'No services'}${d.feeder?' · '+h(shortF(d.feeder)):''}</span><span class="pr">${d.list.length?`<b>${done}/${st.n}</b>${meter(done,st.n)}`:''}</span></button>`};
  let drawn='';
  const draw=()=>{const top=body.scrollTop,hgt=body.clientHeight||600;const a=Math.max(0,Math.floor(top/RH)-6),b=Math.min(items.length,Math.ceil((top+hgt)/RH)+6);
    const key=a+':'+b+':'+items.length;if(key===drawn)return;drawn=key;
    let s='';for(let i=a;i<b;i++)s+=row(items[i],i);list.innerHTML=s||'<div class="empty">No DTR matches.</div>'};
  const apply=()=>{const v=q.value.trim();let base=S.dtrs;

    if(/[A-Za-z]/.test(v)){const u=v.toUpperCase();items=base.filter(d=>d.name&&d.name.includes(u))}
    else{const dg=v.replace(/\D/g,'');if(!dg)items=base;else{const rank=d=>d.code===dg?0:d.code.endsWith(dg)?1:2;
      items=base.filter(d=>d.code.includes(dg));items.sort((x,y)=>rank(x)-rank(y)||cmp(x.code,y.code))}}
    list.style.height=Math.max(items.length*RH,60)+'px';drawn='';body.scrollTop=0;draw()};
  body.addEventListener('scroll',()=>requestAnimationFrame(draw),{passive:true});
  q.addEventListener('input',apply);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&items[0]){e.preventDefault();pick(items[0].code)}});
  el.querySelector('#dsF').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;el.querySelectorAll('#dsF [data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));apply()});

  list.style.height=items.length*RH+'px';
  const ci=cur?S.dtrs.findIndex(d=>d.code===cur):-1;
  requestAnimationFrame(()=>{if(ci>2)body.scrollTop=(ci-2)*RH;draw()});draw();
}

      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[B.QR_CODE,B.CODE_128,B.CODE_39,B.ITF,B.EAN_13,B.DATA_MATRIX,B.CODABAR,B.CODE_93]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(hints)}

    const fm=res.getBarcodeFormat();return{text:res.getText(),format:ZXing.BarcodeFormat[fm]||String(fm)}}catch(e){}}

/* ---------- native scanner (Android app): Google ML Kit, full screen, continuous ----------
   The camera preview is drawn behind the web page, so while scanning the page turns transparent and only this overlay shows:
   the scan frame, torch and zoom, and a bottom sheet with the running counts and the result of each meter (with its decision buttons). */
// ITF, Codabar, EAN-8 and UPC-E are left out: they give false reads on partial 1D codes and meters do not use them
const SCAN_FORMATS=['QR_CODE','CODE_128','CODE_39','CODE_93','DATA_MATRIX','EAN_13','UPC_A','PDF_417','AZTEC'];
const NScan={active:false,view:null,lastText:'',lastAt:0,torch:false,zoom:1,maxZoom:1,el:null,handles:[],typing:false,seen:new Map(),errShown:false,outAt:0,
  available(){return N.on&&!!N.P('BarcodeScanner')&&!S.noNativeScan},
  async start(view){
    const BS=N.P('BarcodeScanner');if(this.active||!BS)return;
    if(this.stopping)await this.stopping;
    try{let p=await BS.checkPermissions();if(p.camera!=='granted')p=await BS.requestPermissions();
      if(p.camera!=='granted'){const ok=await N.confirm('Camera is off','Allow the camera for this app in Android settings to scan meter codes.','Open settings');if(ok)BS.openSettings().catch(()=>{});return}}catch(e){}
    stopCam();this.active=true;this.view=view;this.typing=false;this.torch=false;this.zoom=1;this.lastText='';this.seen=new Map();this.errShown=false;
    main.innerHTML='';this.render();document.documentElement.classList.add('scanning');
    try{
      this.handles.push(await BS.addListener('barcodesScanned',e=>this.onCodes(e&&e.barcodes)));
      this.handles.push(await BS.addListener('scanError',e=>{if(!this.errShown){this.errShown=true;console.warn('scanError',e&&e.message)}}));
      await BS.startScan({formats:SCAN_FORMATS,lensFacing:'BACK',resolution:2}); // 1920x1080: small name-plate codes read better
      const KA=N.P('KeepAwake');if(KA)KA.keepAwake().catch(()=>{});
      BS.isTorchAvailable().then(r=>{const b=$('soTorch');if(b)b.hidden=!(r&&r.available)}).catch(()=>{});
      BS.getMaxZoomRatio().then(r=>{this.maxZoom=(r&&r.zoomRatio)||1;const b=$('soZoom');if(b)b.hidden=this.maxZoom<1.9}).catch(()=>{});
    }catch(e){ // fall back to the in-page camera for the rest of this session
      S.noNativeScan=true;await this.stop(true);toast('Using the in-page camera instead');
      if(view==='verify'){S.panel='scan';renderVerify()}else if(view==='feeder'){S.fpanel='scan';renderFeeder()}else{S.apanel='scan';renderArea()}
      startLive();
    }
  },
  inFrame(list){ // corner points come in screen pixels; keep codes whose centre is in (or just around) the scan frame, nearest first
    const f=$('soFrame');if(!f)return list;const r=f.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    const cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2,mx=r.width/2+30,my=r.height/2+70;
    const out=[];for(const b of list){const p=b.cornerPoints;if(!p||p.length<4){out.push({b,d:0});continue}
      const x=p.reduce((a,q)=>a+q[0],0)/4/dpr,y=p.reduce((a,q)=>a+q[1],0)/4/dpr;
      if(Math.abs(x-cx)<=mx&&Math.abs(y-cy)<=my)out.push({b,d:Math.hypot(x-cx,y-cy)})}
    return out.sort((a,b)=>a.d-b.d).map(x=>x.b)},
  onCodes(list){
    if(!this.active||!list||!list.length||S.pending||S.fpending||S.apending)return; // hold while a decision is open
    const now=Date.now();let ok=this.inFrame(list);
    if(!ok.length&&list.length===1){ // one code held steady for 2.5 s counts even if the position estimate says it is outside the box
      const tx=String(list[0].rawValue||'');if(this.outText!==tx){this.outText=tx;this.outSince=now}else if(now-this.outSince>2500)ok=list}
    if(!ok.length){if(now-this.outAt>2500){this.outAt=now;const hn=$('soHint');if(hn){hn.textContent='Move the code inside the box';setTimeout(()=>{if(hn.isConnected&&!S.pending)hn.textContent=this.hintText()},1800)}}return}
    const b=ok[0],text=String(b.rawValue||b.displayValue||'').trim();if(!text)return;
    const seenAt=this.seen.get(text);this.seen.set(text,now);
    if(seenAt&&now-seenAt<20000)return; // the same code stays in view: read it once, not again every few seconds
    if(now-this.lastAt<1000)return;
    this.lastText=text;this.lastAt=now;routeScan(text,fmtName(String(b.format||'')),true);
  },
  hintText(){return this.view==='verify'?'Point at the meter QR or barcode':'Point at the code on the DTR'},
  async stop(silent,noRender){
    if(!this.active)return;this.active=false;const BS=N.P('BarcodeScanner');
    document.documentElement.classList.remove('scanning');if(this.el){this.el.remove();this.el=null}
    const hs=this.handles,torch=this.torch;this.handles=[];this.torch=false;
    if(!noRender&&S.ready)go(this.view||S.view); // show the screen at once; the camera shuts down behind it
    const within=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
    this.stopping=(async()=>{
      for(const hd of hs){try{await within(hd.remove(),1000)}catch(e){}}
      try{if(torch)await within(BS.disableTorch(),1000)}catch(e){}
      try{await within(BS.stopScan(),2500)}catch(e){}
      const KA=N.P('KeepAwake');if(KA)KA.allowSleep().catch(()=>{});
    })();
    await this.stopping;this.stopping=null;
  },
  title(){
    if(this.view==='feeder'){const f=S.fMap.get(S.fdr);return['Scan DTR tags',f?f.name:'']}
    if(this.view==='area'){const a=S.aMap.get(S.adr);return['Scan DTR tags',a?a.ac+' · '+a.name:'']}
    const d=S.dtrMap.get(S.dtr);return['DTR '+(S.dtr||'')+' · scan meters',d?(d.name||'NO NAME'):'']},
  stats(){
    if(this.view==='feeder'){const f=S.fMap.get(S.fdr),st=fStats(f);return[['Pending',st.pending,''],['Confirmed',st.ok,'k-ok'],['Other feeder',st.other,'k-warn'],['Not on feeder',st.nf+st.el,'k-bad']]}
    if(this.view==='area'){const a=S.aMap.get(S.adr),st=aStats(a);return[['Pending',st.pending,''],['Confirmed',st.ok,'k-ok'],['Not mapped',st.other,'k-warn'],['Not in area',st.nf,'k-bad']]}
    const st=dtrStats(S.dtrMap.get(S.dtr));return[['Pending',st.pending,''],['Verified',st.ok,'k-ok'],['Other DTR',st.other,'k-warn'],['Not in master',st.unk,'k-bad']]},
  result(){
    const html=this.view==='feeder'?freshen(fResultBlock()):this.view==='area'?freshen(aResultBlock()):resultBlock();
    return html.replace(/<button class="btn sm" data-svc="[^"]*">[^<]*<\/button>/g,''); // no jumping to another screen from the camera
  },
  kind(){ // colour of the frame flash for the latest result
    const p=this.view==='feeder'?S.fpending:this.view==='area'?S.apending:S.pending;if(p)return p.type==='conflict'||p.type==='unknown'?'bad':'warn';
    const r=this.view==='feeder'?S.flast:this.view==='area'?S.alast:S.last;if(!r)return'';
    return r.kind==='ok'?'ok':(r.kind==='unk'||r.kind==='legacy'||r.kind==='conf')?'bad':'warn'},
  render(){
    const [t,sub]=this.title();
    const el=document.createElement('div');el.id='scanOv';el.setAttribute('role','dialog');el.setAttribute('aria-label','Scanner');
    el.innerHTML=`<div class="so-top"><button class="so-btn" id="soClose" aria-label="Close scanner">${I.close}</button><h2>${h(t)}<small>${h(sub)}</small></h2>
        <button class="so-btn" id="soZoom" aria-label="Zoom" hidden>1×</button><button class="so-btn" id="soTorch" aria-label="Torch" aria-pressed="false" hidden>${I.torch}</button></div>
      <div class="so-mid"><div class="so-frame" id="soFrame"><i></i><i></i><i></i><i></i><div class="so-hint" id="soHint"></div></div></div>
      <div class="so-sheet" id="soSheet"></div>`;
    document.body.appendChild(el);this.el=el;
    el.addEventListener('click',e=>this.click(e));
    el.addEventListener('submit',e=>{e.preventDefault();const i=$('soIn');const v=i&&i.value.trim();if(v){i.value='';routeScan(v,'Typed')}});
    this.refresh(true);
  },
  refresh(first){
    if(!this.el)return;const k=first?'':this.kind();
    const pend=this.view==='feeder'?S.fpending:this.view==='area'?S.apending:S.pending;
    $('soHint').textContent=pend?'Decide below to keep scanning':this.hintText();
    const res=this.result();
    $('soSheet').innerHTML=`<div class="so-stats">${this.stats().map(([l,n,c])=>`<span class="${c}"><b>${n}</b>${l}</span>`).join('')}</div>
      ${res||'<div class="so-empty">Each code you scan shows here, with a beep.</div>'}
      ${this.typing?`<form class="row" id="soForm"><label class="field">${I.search}<input id="soIn" autocomplete="off" placeholder="${this.view==='verify'?'Meter / service / UKSCNO':'Structure code (029)'}"></label><button class="btn" type="submit">Check</button></form>`
        :`<button class="btn sm" id="soType" style="align-self:center">${I.kbd}Type a number</button>`}`;
    Who.fill($('soSheet'));
    if(k){const f=$('soFrame');f.classList.remove('ok','warn','bad');void f.offsetWidth;f.classList.add(k);clearTimeout(this._ft);this._ft=setTimeout(()=>f.classList.remove(k),900)}
    if(this.typing){const i=$('soIn');if(i&&!first)i.focus()}
  },
  async click(e){
    const b=e.target.closest('button');if(!b)return;const BS=N.P('BarcodeScanner');
    if(b.id==='soClose')return this.stop();
    if(b.id==='soTorch'){try{await BS.toggleTorch();this.torch=!this.torch;b.setAttribute('aria-pressed',this.torch)}catch(err){}return}
    if(b.id==='soZoom'){const steps=[1,2,this.maxZoom>=4?4:0].filter(Boolean);this.zoom=steps[(steps.indexOf(this.zoom)+1)%steps.length]||1;
      try{await BS.setZoomRatio({zoomRatio:Math.min(this.zoom,this.maxZoom)});b.textContent=this.zoom+'×'}catch(err){}return}
    if(b.id==='soType'){this.typing=true;this.refresh(true);const i=$('soIn');if(i)i.focus();return}
    if(b.dataset.pa)return decide(b.dataset.pa);
    if(b.dataset.fa)return decideF(b.dataset.fa);
    if(b.dataset.aa)return decideA(b.dataset.aa);
    if(b.id==='undoBtn')return undoVerify();
    if(b.id==='fUndo')return undoF();
    if(b.id==='aUndo')return undoA();
  }
};

/* ---------- IR / IRDA ---------- */
let logStarted=false;
function logLine(cls,txt){const l=$('log');if(!l)return;if(!logStarted){l.innerHTML='';logStarted=true}const s=document.createElement('div');s.className=cls;s.textContent=txt;l.appendChild(s);l.scrollTop=l.scrollHeight}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function connectProbe(){
  logStarted=false;
  if('serial' in navigator){
    logLine('dim','Requesting USB optical probe…');
    try{
      const port=await navigator.serial.requestPort();
      await port.open({baudRate:300,dataBits:7,parity:'even',stopBits:1});
      const ps=$('probeState');ps.textContent='Probe connected';ps.className='pill ok';
      logLine('tx','→ /?!<CR><LF>   sign-on @300 baud');
      const w=port.writable.getWriter();await w.write(new TextEncoder().encode('/?!\r\n'));w.releaseLock();
      const rd=port.readable.getReader();let buf='';const until=Date.now()+3000;
      while(Date.now()<until&&!buf.includes('\n')){const r=await Promise.race([rd.read(),sleep(3000).then(()=>({done:true}))]);if(r.done)break;buf+=new TextDecoder().decode(r.value)}
      rd.releaseLock();
      if(buf.trim()){logLine('rx','← '+buf.trim());logLine('ok','Meter answered. Reading its serial needs the DLMS session in the Android app (see Guide).')}
      else logLine('er','Meter Reading failed: No response from meter. Check mode, alignment and shade the probe.');
      await port.close();
    }catch(e){logLine('er','Probe not opened: '+(e&&e.message?e.message:e)+'\nThis view blocks USB and Bluetooth. Real probe reads need the Android app (see Guide).')}
    return;
  }
  logLine('er','This browser cannot talk to an optical probe.\nReal IR/IRDA reads need the Android app with a USB-OTG or Bluetooth probe. See the Guide tab.');
}

  const M=IRMODES.find(m=>m.id===S.irMode);const btn=$('demoBtn');btn.disabled=true;logStarted=false;

  const o=pend.find(x=>x.ph===M.ph)||pend[0]||S.recs.find(x=>x.m!=='0'&&x.ph===M.ph&&x.dtr!==S.dtr);
  const kwh=(o.r+Math.max(1,Math.round(o.av||40))).toFixed(1);
  const steps=[
    ['dim',`${M.label} · opening optical port, 300 baud 7E1`,300],
    ['tx','→ /?!<CR><LF>                 sign-on request',320],
    ['rx',`← /${(o.mk||'MTR').replace(/\W/g,'').slice(0,3)}5 ${o.ph}P DLMS`,380],
    ['tx','→ <ACK>2 5 2                  9600 baud, HDLC mode E',300],
    ['tx','→ SNRM',200],['rx','← UA',220],
    ['tx','→ AARQ  association request',300],['rx','← AARE  accepted',260],
    ['tx','→ GET 0.0.96.1.0.255   meter serial number',260],['rx','← '+o.m,280],
    ['tx','→ GET 1.0.1.8.0.255    cumulative kWh',220],['rx','← '+kwh+' kWh',220],
    ['tx','→ DISC',160],['rx','← UA  session closed',160],['ok','Read complete (demo values). Checking serial against DTR…',200]];
  for(const [c,t,ms] of steps){if(S.view!=='verify'||S.panel!=='ir')return;logLine(c,t);await sleep(ms)}

/* ---------- FEEDERS: feeder-wise structure check ----------
   S.fv[feederCode] = { s:{ structureCode:{st,src,t,by,mf,reason} } }
   st: ok = structure confirmed on its own feeder · other = found on this feeder, mapping says another feeder
       conf = disputed, sent to admin review · nf = not on this feeder at site
   One structure, one feeder: a second feeder claim is held and goes to the admin. */
Object.assign(Store,{seenF:new Set(),
  subscribeF(){
    try{this.db.collection('feeder').onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(d=>{this.seenF.add(d.id);const x=d.data();if(!x||!x.fc)return;const cur=S.fv[x.fc]||(S.fv[x.fc]={s:{}});
        if(mergeRecs(cur.s,x.s)){changed=true;Persist.f(x.fc)}});
      if(changed){bumpF();rerenderIdle()}
    },()=>{})}catch(e){}
  },
  async putF(fc,key,rec){
    const cur=S.fv[fc]||(S.fv[fc]={s:{}});cur.s[key]=rec;bumpF();Persist.f(fc);
    if(this.mode!=='db')return;
    const id='f'+fc,ref=this.db.doc('feeder/'+id);
    try{let ex=this.seenF.has(id);if(!ex){const s=await ref.get();ex=s.exists}
      if(ex)await ref.update({s:{[key]:rec}});else await ref.set({fc,s:cur.s});this.seenF.add(id);
    }catch(e){toast('Could not sync. Saved on this device.')}
  }
});
const fvrec=fc=>S.fv[fc]||{s:{}};
const fName=fc=>S.fNames.get(fc)||'No feeder in mapping';
function claimsF(code,exceptFc){const out=[];for(const [fc,v] of Object.entries(S.fv)){if(fc===exceptFc)continue;const r=v.s&&v.s[code];if(isClaim(r))out.push({fc,rec:r})}return out.sort((a,b)=>a.rec.t-b.rec.t)}
/* feeder indexes are cached until the next feeder change */
const FC={rev:0,cx:null,el:null,st:new Map()};
function bumpF(){FC.rev++;FC.cx=null;FC.el=null;FC.st.clear()}
function fConflictIndex(){if(FC.cx)return FC.cx;const m=new Map();for(const [fc,v] of Object.entries(S.fv))for(const [k,r] of Object.entries(v.s||{}))if(isClaim(r)){if(!m.has(k))m.set(k,[]);m.get(k).push({fc,rec:r})}
  for(const [k,c] of m)if(c.length<2)m.delete(k);else c.sort((a,b)=>a.rec.t-b.rec.t);return FC.cx=m}
function fElsewhere(){if(FC.el)return FC.el;const m=new Map();for(const [fc,v] of Object.entries(S.fv))for(const [k,r] of Object.entries(v.s||{}))if(live(r)&&(r.st==='other'||r.st==='conf'))m.set(k,{fc,rec:r});return FC.el=m}

function resolveStruct(text){
  const t=String(text||'').toUpperCase().trim();
  for(const x of t.match(/\d{10}/g)||[])if(S.dtrMap.has(x))return x;
  const dg=t.replace(/\D/g,'');if(!dg)return null;
  if(S.dtrMap.has(dg))return dg;
  if(dg.length<3)return null;
  const m=[...S.dtrMap.keys()].filter(c=>c.length===10&&c.endsWith(dg));return m.length===1?m[0]:null;

  return processStruct(code,src);

async function processStruct(code,src){
  if(!S.fdr)return;const d=S.dtrMap.get(code);const now=Date.now();const prev=fvrec(S.fdr).s[code];
  const others=claimsF(code,S.fdr);
  if(others.length){S.fpending={type:'conflict',code,src,others};S.flast=null;beep('bad');return showF()}
  if(d.fc===S.fdr){const dup=live(prev)&&prev.st==='ok';
    if(!dup)await Store.putF(S.fdr,code,{st:'ok',src,t:now,by:Who.id});
    S.flast={kind:'ok',code,src,dup,dupT:dup?prev.t:0,undo:dup?null:{key:code,prev}};beep('ok');
  }else if(isClaim(prev)){S.flast={kind:prev.st,code,src,dup:true,dupT:prev.t};beep('warn')}
  else{S.fpending={type:'confirm',code,src};S.flast=null;beep('warn');return showF()}
  S.fpending=null;showF();
}
async function decideF(action){

  if((action==='review'||action==='move')&&!reason){toast('Choose a reason first');return}
  const prev=fvrec(S.fdr).s[code];
  if(action==='confirm'){await Store.putF(S.fdr,code,{st:'other',src:p.src,t:now,mf:d.fc||'',by:Who.id});S.flast={kind:'other',code,src:p.src,undo:{key:code,prev}};beep('ok')}
  else if(action==='review'){await Store.putF(S.fdr,code,{st:'conf',src:p.src,t:now,mf:d.fc||'',reason,by:Who.id});S.flast={kind:'conf',code,src:p.src,reason,undo:{key:code,prev}};toast('Sent to admin review')}

/* ---------- AREAS: area-code-wise structure check ----------
   S.av[areaCode] = { s:{ structureCode:{st,src,t,by,reason} } }
   st: ok = confirmed in this area (mapping links it) · other = found in this area, mapping does not link it · nf = not in this area at site
   A structure may be in several areas, so there is no one-area rule; a structure outside the mapping asks before it is recorded. */

const avrec=ac=>S.av[ac]||{s:{}};

function aPending(a){const v=avrec(a.ac);return a.list.filter(x=>!live(v.s[x.d.code]))}
function aStats(a){const v=avrec(a.ac);let ok=0,nf=0,other=0;

async function processAreaText(text,src){const code=resolveStruct(text);

function areaShares(d){return Object.entries(d.acs||{}).sort((x,y)=>y[1]-x[1]).map(([ac,n])=>`${h(ac)} ${h((S.aMap.get(ac)||{}).name||'')} (${n})`).join(', ')||'none'}

function svcMoveHtml(o){

async function saveMove(o){
  const m=S.mv;if(!m||!m.to)return;
  const reason=($('mvReason').value||'').trim(),remark=($('mvRemark').value||'').trim();
  if(!reason){toast('Choose a reason');$('mvReason').focus();return}
  if(reason.startsWith('Other')&&!remark){toast('Write the remark');$('mvRemark').focus();return}
  const why=reason.startsWith('Other')?remark:(remark?reason+' · '+remark:reason);
  const now=Date.now(),to=m.to,from=m.from,others=claimsFor(o.u,null).filter(c=>c.dtr!==to);
  if(others.length&&!Who.sup){ // staff cannot remove someone else's entry: the move waits for the admin
    await Store.put(to,'s',o.u,{st:'conf',src:'Moved (service page)',t:now,mdtr:o.dtr,reason:why,by:Who.id,from});
    S.mv=null;beep('warn');toast('Sent to admin review');renderSvc();return}
  await Store.put(to,'s',o.u,{st:to===o.dtr?'ok':'other',src:'Moved (service page)',t:now,mdtr:o.dtr,reason:why,by:Who.id,moved:1,from});
  for(const c of others)await Store.put(c.dtr,'s',o.u,{del:1,t:now,movedTo:to,reason:why,by:Who.id});
  if(from!==to&&!others.some(c=>c.dtr===from)){const fr=vrec(from).s[o.u];if(live(fr))await Store.put(from,'s',o.u,{del:1,t:now,movedTo:to,reason:why,by:Who.id})}

}

function searchAll(raw){
  const q=raw.trim().toUpperCase();if(q.length<3)return[];
  const out=[],seen=new Set();const add=o=>{if(o&&!seen.has(o.u)&&out.length<60){seen.add(o.u);out.push(o)}};
  add(S.byU.get(q));add(S.byS.get(q));(S.byM.get(normM(q))||[]).forEach(add);const nq=normM(q);
  const qc=q.replace(/\s+/g,'');
  for(const o of S.recs){if(out.length>=60)break;if(o.s.includes(q)||(qc.length>=4&&o.sc.includes(qc))||o.u.startsWith(q)||(nq.length>=4&&o.mn.includes(nq))||o.N.includes(q))add(o)}
  return out;
}

    a.svc++;o.ph===3?a.p3++:a.p1++;a.ld+=o.ld;a[ss.get(o.u)]++}
  return g}

async function resolveConflict(u,keep){
  if(!Who.sup){toast('Only the admin can resolve conflicts');return}
  const o=S.byU.get(u);const c=claimsFor(u,null);const now=Date.now();
  const w=c.find(x=>x.dtr===keep);if(!w)return;
  await Store.put(keep,'s',u,{...w.rec,st:keep===o.dtr?'ok':'other',mdtr:o.dtr,t:now,resolved:1,resolvedBy:Who.id});
  for(const x of c)if(x.dtr!==keep)await Store.put(x.dtr,'s',u,{del:1,t:now,movedTo:keep,by:Who.id,reason:'Admin resolved conflict'});
  toast(o.s+' kept on DTR '+keep);vReport();
}

const csvRow=r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',');
const HEAD=['DTR_VERIFIED','STRUCTURE_NAME','FEEDER','RESULT','SERVICE_NO','UKSCNO','METER_NO','MASTER_DTR','NAME','PHASE','SOURCE','SCANNED_TEXT','TIME'];
const LBL={ok:'VERIFIED',other:'FOUND HERE - MASTER DTR DIFFERS',conf:'DISPUTED - IN ADMIN REVIEW',nf:'NOT FOUND AT SITE',na:'NO ACCESS'};
function dtrRows(d,withPending,elsew){
  const v=vrec(d.code),rows=[];elsew=elsew||elsewhereIndex();
  for(const o of d.list){const r=v.s[o.u];
    if(live(r))rows.push([d.code,d.name||'NO NAME',d.feeder||'',LBL[r.st],o.s,o.u,o.m,o.dtr,o.n,o.ph,r.src,r.raw||'',tstr(r.t)]);
    else if(elsew.has(o.u)){const e=elsew.get(o.u);rows.push([d.code,d.name||'NO NAME',d.feeder||'','SEEN ON DTR '+e.dtr,o.s,o.u,o.m,o.dtr,o.n,o.ph,e.rec.src,e.rec.raw||'',tstr(e.rec.t)])}
    else if(withPending)rows.push([d.code,d.name||'NO NAME',d.feeder||'','PENDING',o.s,o.u,o.m,o.dtr,o.n,o.ph,'','',''])}
  for(const [u,r] of Object.entries(v.s))if(live(r)&&(r.st==='other'||r.st==='conf')){const o=S.byU.get(u);if(o)rows.push([d.code,d.name||'NO NAME',d.feeder||'',LBL[r.st]+(r.reason?' ('+r.reason+')':''),o.s,o.u,o.m,o.dtr,o.n,o.ph,r.src,r.raw||'',tstr(r.t)])}
  for(const r of Object.values(v.x))if(live(r)){const o=r.u?S.byU.get(r.u):null;rows.push([d.code,d.name||'NO NAME',d.feeder||'',o?'NOT IN CURRENT MAPPING':'METER NOT IN MASTER',o?o.s:'',o?o.u:'',o?o.m:r.raw,o?o.dtr:'',o?o.n:'',o?o.ph:'',r.src,r.raw,tstr(r.t)])}
  return rows;
}
async function saveCsv(name,rows){

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Download is not available here')}
}

/* Android app (Capacitor): files are written to the app cache and handed to the share sheet (WhatsApp, Drive, Files) */
async function nativeSave(name,text){
  if(!isNative())return false;
  const FS=capPlugin('Filesystem'),SH=capPlugin('Share');
  if(!FS){toast('File saving is not available in this build');return true}
  try{
    const r=await FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
    if(SH){try{await SH.share({title:name,files:[r.uri],dialogTitle:'Save or send '+name})}catch(e){if(!/cancel/i.test(String(e&&e.message)))await SH.share({title:name,url:r.uri}).catch(()=>{})}}
    else toast('Saved '+name+' in the app');
  }catch(e){toast('Could not save '+name)}
  return true;
}
async function saveRaw(name,csv){
  if(await nativeSave(name,csv))return;
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:csv});toast('Saved '+name);return}}}catch(e){if(e&&e.code==='declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Download is not available here')}
}

/* ---------- sign in ----------
   Logins are kept on this phone. Passwords are stored only as salted SHA-256 hashes.
   Default: user "admin", password 123456 (change it after the first sign-in). The admin adds staff logins.
   This locks the app on a shared phone; it is not server security, because the code runs on the phone. */
function sha256(ascii){ // compact SHA-256 over a byte string (works without crypto.subtle)
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  const mw=Math.pow(2,32);let res='',i,j;const words=[],bl=ascii.length*8;
  let hash=sha256.h=sha256.h||[];const k=sha256.k=sha256.k||[];let pc=k.length;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*mw)|0;k[pc++]=(Math.pow(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bl/mw)|0);words[words.length]=bl;
  for(j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
  return res;
}

    if(!validName(n)){toast('User name: 2–20 lowercase letters, numbers, dot, dash or underscore');return}
    if(Auth.users()[n]){toast('That user name already exists');return}
    if(pw.length<6){toast('Password must be at least 6 characters');return}
    if(Auth.setPassword(n,pw,r)){toast('Login added for '+n);vGuide();const d=$('acct');if(d)d.scrollIntoView({block:'start'})}};
  main.querySelectorAll('[data-udel]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again';return}if(Auth.remove(b.dataset.udel)){toast('Removed');vGuide()}});
  main.querySelectorAll('[data-ureset]').forEach(b=>b.onclick=()=>{const n=b.dataset.ureset;const box=document.createElement('form');box.className='row';box.style.gridColumn='1/-1';
    box.innerHTML=`<input class="inp" type="password" autocomplete="new-password" placeholder="New password for ${h(n)}" style="flex:1;min-width:0"><button class="btn sm" type="submit">Save</button>`;
    b.closest('.drow').appendChild(box);b.remove();box.querySelector('input').focus();
    box.onsubmit=e=>{e.preventDefault();const pw=box.querySelector('input').value;if(pw.length<6){toast('At least 6 characters');return}if(Auth.setPassword(n,pw)){toast('Password reset for '+n);vGuide()}}});
}

/* Android back button: close the sheet, scanner, decision or panel first, then go back to Services, then leave the app */
let backBound=false;
function bindBackButton(){
  const App=capPlugin('App');if(backBound||!App||!App.addListener)return;backBound=true;
  App.addListener('backButton',()=>{
    if(Drawer.close())return;
    if(Sheet.close())return;
    if(S.pending){S.pending=null;return showResult()}
    if(S.fpending){S.fpending=null;return showF()}
    if(S.apending){S.apending=null;return showA()}
    if(NScan.active)return NScan.stop();
    if(S.view==='search'&&S.svc){if(S.mv){S.mv=null}else S.svc=null;return renderSvc()}
    if(cam.stream||cam.timer||S.panel||S.fpanel||S.apanel){stopCam();S.panel=null;S.fpanel=null;S.apanel=null;return go(S.view)}
    if(S.view!=='verify'&&S.ready)return go('verify',true);
    App.exitApp();
  });
}
function moveCard(){return ''}
/* pull down at the top of a list screen to sync with the Google Sheet */
function bindPullToSync(){
  const ptr=$('ptr');let y0=null,dy=0,armed=false;
  const ok=()=>S.ready&&['verify','feeder','area','report','search'].includes(S.view)&&!Sheet.el&&!NScan.active&&!cam.stream&&window.scrollY<=0;
  window.addEventListener('touchstart',e=>{if(!ok()||e.touches.length>1){y0=null;return}y0=e.touches[0].clientY;dy=0;armed=false},{passive:true});
  window.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy<=0||window.scrollY>0){ptr.style.opacity=0;return}
    const p=Math.min(dy,110);ptr.style.transition='none';ptr.style.opacity=Math.min(1,p/70);ptr.style.transform=`translateY(${p-70}px) rotate(${p*3}deg)`;
    if(p>=80&&!armed){armed=true;N.tap()}else if(p<80)armed=false},{passive:true});
  window.addEventListener('touchend',()=>{if(y0==null)return;y0=null;ptr.style.transition='transform .2s,opacity .2s';
    if(armed){ptr.classList.add('go');ptr.style.transform='translateY(14px)';
      const done=m=>{ptr.classList.remove('go');ptr.style.opacity=0;ptr.style.transform='translateY(-70px)';if(m)toast(m)};
      if(!Backup.ready()&&Store.mode!=='db'){done('Not syncing. Set the Sheet link in Guide.');return}
      if(!isOnline()){done('Offline. Entries are saved on this phone.');return}
      Backup.sync().then(()=>{const l=Backup.cfg().last;done(l&&l.ok?'Synced':'Sync failed: '+((l&&l.msg)||''))})}
    else{ptr.style.opacity=0;ptr.style.transform='translateY(-70px)'}});
}

/* ---------- start ---------- */
let started=false;
async function startApp(){
  document.querySelector('.tabs').hidden=false;document.querySelectorAll('.tab').forEach(b=>b.disabled=false);
  Who.fromSession();$('userPill').hidden=true;$('menuBtn').hidden=false;
  let P=null;
  try{P=await IDB.get('section')}catch(e){}
  if(!P){try{P=await embeddedParts()}catch(e){}}
  if(!P){showSetup();return}
  try{await loadData(P)}catch(e){showSetup('The saved data could not be read. Load the section data file again.');return}
  S.P=P;S.meta=P.meta||{};S.ready=true;bindBackButton();
  await Persist.load();
  try{const d=localStorage.getItem(LSDTR);if(d&&S.dtrSet.has(d))S.dtr=d;S.fdr=localStorage.getItem(LSFS)||S.fdr;S.adr=localStorage.getItem(LSAS)||S.adr}catch(e){}
  if(!S.fdr||!S.fMap.has(S.fdr))S.fdr=S.feeders[0].fc;
  if(!S.adr||!S.aMap.has(S.adr))S.adr=S.areas[0].ac;
  if(!S.dtr){const f=S.dtrs.find(d=>d.list.length);if(f)S.dtr=f.code}
  go('verify');N.hideSplash();
  (window.requestIdleCallback||(f=>setTimeout(f,400)))(()=>{try{S.dtrs.forEach(d=>dtrStats(d));reportData()}catch(e){}},{timeout:4000}); // warm the caches while idle
  Store.init();
  Who.init();
  // sync with the Google Sheet: bring in other phones' entries, then send ours
  updateBadge();
  if(started)return;started=true;
  $('storeBadge').onclick=()=>{N.tap();if(Backup.ready()){toast('Syncing…');Backup.sync().then(()=>toast(Backup.cfg().last&&Backup.cfg().last.ok?'Synced':'Sync failed: '+(Backup.cfg().last||{}).msg))}else go('guide')};
  window.addEventListener('online',()=>{updateBadge();Backup.sync()});window.addEventListener('offline',updateBadge);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Backup.sync();else{Persist.flush();FileBackup.write()}});
  window.addEventListener('pagehide',()=>{Persist.flush()});
  setInterval(()=>{if(document.visibilityState==='visible'&&isOnline())Backup.sync()},180000);
  if(Backup.ready())setTimeout(()=>Backup.sync(),2500);
  bindPullToSync();
  let test=false;try{test=localStorage.getItem('yrg_test')==='1'}catch(e){}
  if(test)window.__yrg={scan:(t,src)=>routeScan(t,src||'Test'),S,D,NScan,Backup,FileBackup,Persist,net};
}
(async()=>{N.init();if(Auth.session())await startApp();else showLogin()})();
})();
